name: Run daily + publish docs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # daily 03:00 UTC

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      COPERNICUSMARINE_LOG_LEVEL: WARNING

      # Credentials (toolbox standard names)
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}

      # Credentials (project alias names)
      COPERNICUS_MARINE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUS_MARINE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}

      # STRICT: do not allow synthetic fallback
      SEYDYAAR_STRICT_COPERNICUS: "1"

      # Where to save downloaded .nc during the run (relative to backend/ because we cd backend in many setups)
      SEYDYAAR_TMPDIR: ".seydyaar_tmp"
      # Where to write manifests (these will be committed because they're under docs/latest)
      SEYDYAAR_LOG_DIR: "docs/latest/logs"

      # Incremental by default (set to 1 only when you want full rebuild)
      SEYDYAAR_FORCE_REGEN: "0"

      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -U copernicusmarine
          pip install h5py netCDF4

      - name: Run pipeline (writes docs/latest)
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          python -m seydyaar run-daily --out docs/latest --past-days 2 --future-days 10 --step-hours 6 --grid 220x220

      - name: Commit & push updated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/latest
          git commit -m "Update docs/latest (auto)" || echo "No changes to commit"
          git push
