name: Run daily + publish docs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"  # daily 03:00 UTC

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      COPERNICUSMARINE_LOG_LEVEL: WARNING

      # Credentials (toolbox standard names)
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}

      # Credentials (project alias names)
      COPERNICUS_MARINE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUS_MARINE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}

      # STRICT: do not allow synthetic fallback
      SEYDYAAR_STRICT_COPERNICUS: "1"

      # Where to save downloaded .nc during the run
      SEYDYAAR_TMPDIR: "backend/.seydyaar_tmp"

      # Where to write manifests (these will be committed because they're under docs/latest)
      SEYDYAAR_LOG_DIR: "docs/latest/logs"

      # Incremental by default (set to 1 only when you want full rebuild)
      SEYDYAAR_FORCE_REGEN: "0"

      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -U copernicusmarine
          pip install h5py netCDF4

      # 1) Validate *repo* JSON/GEOJSON early (catches broken config files)
      - name: Validate all JSON and GEOJSON (repo)
        run: |
          python - << 'PY'
          import json
          from pathlib import Path

          bad = []
          for p in Path(".").rglob("*.json"):
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  bad.append((str(p), str(e)))

          for p in Path(".").rglob("*.geojson"):
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  bad.append((str(p), str(e)))

          if bad:
              print("❌ Invalid JSON files in repo:")
              for f, e in bad:
                  print("-", f, "=>", e)
              raise SystemExit(1)

          print("✅ All repo JSON/GEOJSON files are valid.")
          PY

      # Optional: print a couple of key fields so it's obvious which CMEMS dataset/variable is used
      - name: Debug datasets.json (prints key fields)
        run: |
          python - << 'PY'
          import json
          p = "backend/config/datasets.json"
          cfg = json.load(open(p, "r", encoding="utf-8"))
          cm = cfg.get("cmems", cfg)
          print("ssh.dataset_id =", cm["ssh"]["dataset_id"])
          print("ssh.variable   =", cm["ssh"]["variable"])
          PY

      - name: Run pipeline (writes docs/latest)
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          python -m seydyaar run-daily             --out docs/latest             --past-days 2             --future-days 10             --step-hours 6             --grid 220x220

      # 2) Validate generated outputs (catches truncated/invalid JSON written by the pipeline)
      - name: Validate JSON outputs (docs/latest)
        if: always()
        run: |
          python - << 'PY'
          import json
          from pathlib import Path

          out = Path("docs/latest")
          if not out.exists():
              raise SystemExit("docs/latest not found")

          bad = []
          for p in out.rglob("*.json"):
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  bad.append((str(p), str(e)))

          if bad:
              print("❌ Invalid JSON outputs in docs/latest:")
              for f, e in bad:
                  print("-", f, "=>", e)
              raise SystemExit(1)

          print("✅ All docs/latest JSON outputs are valid.")
          PY

      - name: List downloaded NetCDFs (tmpdir)
        if: always()
        run: |
          echo "=== NetCDF files under backend/.seydyaar_tmp ==="
          ls -lah backend/.seydyaar_tmp || true
          echo "=== Count ==="
          (ls -1 backend/.seydyaar_tmp/*.nc 2>/dev/null | wc -l) || true

      - name: Upload NetCDFs as artifact (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copernicus_nc_files
          path: backend/.seydyaar_tmp/*.nc
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit & push updated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/latest
          git commit -m "Update docs/latest (auto)" || echo "No changes to commit"
          git push
