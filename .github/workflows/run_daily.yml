name: Seyd-Yaar Daily Run

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"   # daily 03:15 UTC
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run generator
        env:
          COPERNICUS_MARINE_USERNAME: ${{ secrets.COPERNICUS_MARINE_USERNAME }}
          COPERNICUS_MARINE_PASSWORD: ${{ secrets.COPERNICUS_MARINE_PASSWORD }}
          GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}
        run: |
          # Product rule: 6-hour cadence, keep 2 days past + up to 10 days forecast
          PYTHONPATH=backend python -m seydyaar run-daily --out docs/latest --past-days 2 --future-days 10 --step-hours 6

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/latest
          git commit -m "Update daily outputs" || echo "No changes"
          git push
