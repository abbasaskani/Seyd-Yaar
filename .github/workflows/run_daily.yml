name: Run daily + publish docs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}

      COPERNICUS_MARINE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUS_MARINE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}

      GFW_API_ACCESS_TOKEN: ${{ secrets.GFW_API_ACCESS_TOKEN }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -U copernicusmarine

      - name: Sanity check env (safe)
        run: |
          python - << 'PY'
          import os
          u = (os.getenv("COPERNICUS_MARINE_USERNAME") or os.getenv("COPERNICUSMARINE_SERVICE_USERNAME") or "").strip()
          p = (os.getenv("COPERNICUS_MARINE_PASSWORD") or os.getenv("COPERNICUSMARINE_SERVICE_PASSWORD") or "").strip()
          print("Has username:", bool(u))
          print("Has password:", bool(p))
          PY

      - name: Run pipeline (writes docs/latest)
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          python -m seydyaar run-daily --out docs/latest --past-days 7 --future-days 4 --step-hours 6 --grid 220x220

      - name: Commit & push updated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/latest
          git commit -m "Update docs/latest (auto)" || echo "No changes to commit"
          git push
