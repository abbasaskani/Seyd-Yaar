name: Run daily + publish docs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      COPERNICUSMARINE_LOG_LEVEL: WARNING

      # Copernicus Marine Toolbox expected names
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}

      # Project alias names
      COPERNICUS_MARINE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUS_MARINE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}

      # Pipeline control
      SEYDYAAR_FORCE_REGEN: "0"
      SEYDYAAR_STRICT_COPERNICUS: "1"   # ✅ fail instead of synthetic fallback

      # Where to save downloaded .nc during the run (temporary)
      SEYDYAAR_TMPDIR: "backend/.seydyaar_tmp"

      # Where to store audit logs (committed)
      SEYDYAAR_LOG_DIR: "docs/latest/logs"

      # Where to store verification NetCDF snapshot (committed)
      SEYDYAAR_VERIFY_DIR: "docs/latest/verify"

      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install -U pip
          pip install -r backend/requirements.txt
          # Make sure toolbox exists (if not in requirements)
          pip show copernicusmarine || pip install -U copernicusmarine

      - name: Compute verify TIME_ID (today 00:00Z)
        run: |
          echo "SEYDYAAR_VERIFY_TIME_ID=$(date -u +%Y%m%d)_0000Z" >> $GITHUB_ENV
          echo "Verify TIME_ID: $SEYDYAAR_VERIFY_TIME_ID"

      - name: Describe key datasets (sanity)
        run: |
          copernicusmarine describe --dataset-id cmems_mod_glo_phy_anfc_0.083deg_PT1H-m
          copernicusmarine describe --dataset-id cmems_mod_glo_bgc-pft_anfc_0.25deg_P1D-m
          copernicusmarine describe --dataset-id cmems_mod_glo_wav_anfc_0.083deg_PT3H-i

      - name: Run pipeline (daily)
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          python -m seydyaar

      - name: Show audit + verify outputs
        run: |
          echo "=== download_manifest.jsonl ==="
          ls -lah docs/latest/logs || true
          test -f docs/latest/logs/download_manifest.jsonl && tail -n 5 docs/latest/logs/download_manifest.jsonl || echo "manifest missing"
          echo "=== verify folder ==="
          ls -lah "docs/latest/verify/${SEYDYAAR_VERIFY_TIME_ID}" || true
          echo "=== tmpdir nc count ==="
          ls -lah "$SEYDYAAR_TMPDIR" || true
          (ls -1 "$SEYDYAAR_TMPDIR"/*.nc 2>/dev/null | wc -l) || true

      - name: Upload verification NetCDFs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: verify_netcdf
          path: docs/latest/verify/**/*.nc
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Copernicus download manifest (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: download_manifest
          path: docs/latest/logs/download_manifest.jsonl
          if-no-files-found: warn
          retention-days: 30

      - name: Commit docs/latest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/latest
          git commit -m "Update docs/latest (auto)" || echo "No changes to commit"
          git push
